<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Locator</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <h1>EV Station Locator</h1>
                </div>
            </div>
            
            <div class="sidebar-content">
                <!-- Connector Type Selection -->
                <div class="form-group">
                    <label for="connector-type">
                        <span class="label-icon">🔌</span>
                        Car / Connector Type
                    </label>
                    <select id="connector-type" class="form-control">
                        <option value="all">All Connectors</option>
                        <option value="Tesla">Tesla</option>
                        <option value="CCS">CCS (Combined Charging System)</option>
                        <option value="Type2">Type 2 (Mennekes)</option>
                    </select>
                </div>
                
                <!-- Battery Percentage Slider -->
                <div class="form-group">
                    <label for="battery-percent">
                        <span class="label-icon">🔋</span>
                        Current Battery: <span id="battery-value">50</span>%
                    </label>
                    <input type="range" id="battery-percent" class="form-range" 
                           min="0" max="100" value="50">
                    <div class="range-labels">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                </div>
                
                <!-- Range Display -->
                <div class="range-info">
                    <div class="range-display">
                        <span class="range-label">Estimated Range:</span>
                        <span id="range-value" class="range-number">150 km</span>
                    </div>
                </div>
                
                <!-- Find Stations Button -->
                <button id="find-stations-btn" class="btn btn-primary">
                    <span class="btn-icon">📍</span>
                    Find Stations
                </button>
                
                <!-- Status Messages -->
                <div id="status-message" class="status-message"></div>
                
                <!-- Station List -->
                <div class="station-list-container">
                    <h3 class="section-title">Nearby Stations</h3>
                    <div id="station-list" class="station-list">
                        <p class="placeholder-text">Click "Find Stations" to search for charging stations near you.</p>
                    </div>
                </div>
                
                <!-- Turn-by-Turn Directions -->
                <div id="directions-container" class="directions-container hidden">
                    <div class="directions-header">
                        <h3 class="section-title">🧭 Route Directions</h3>
                        <button id="close-directions" class="close-directions-btn">✕</button>
                    </div>
                    <div id="route-summary" class="route-summary"></div>
                    <div id="directions-list" class="directions-list"></div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <p>Max Range: 300 km @ 100% battery</p>
            </div>
        </aside>
        
        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
            
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Finding stations...</p>
            </div>
        </main>
    </div>
    
    <!-- Leaflet JS - Load first -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Leaflet Routing Machine JS - Load second -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- Custom JavaScript - Load last -->
    <script>
        // Configuration
        const MAX_RANGE_KM = 300;
        const DEFAULT_CENTER = [18.5204, 73.8567]; // Pune, India
        const DEFAULT_ZOOM = 12;
        
        // Global variables
        let map;
        let userMarker = null;
        let rangeCircle = null;
        let stationMarkers = [];
        let userLocation = null;
        let routingControl = null;
        let currentRoute = null;
        let stationsData = [];
        
        // Custom icon creator
        function createIcon(color, emoji) {
            return L.divIcon({
                className: 'custom-marker',
                html: `<div class="marker-pin" style="background-color: ${color};">
                    <span style="transform: rotate(45deg); font-size: 16px;">${emoji}</span>
                </div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -35]
            });
        }
        
        // Define icons
        const userIcon = createIcon('#3b82f6', '📍');
        const stationIconReachable = createIcon('#22c55e', '⚡');
        const stationIconUnreachable = createIcon('#ef4444', '⚡');
        const stationIconFull = createIcon('#f59e0b', '⚡');
        
        // Initialize map
        function initMap() {
            map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }
        
        // Get user's geolocation
        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation is not supported by your browser'));
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const location = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        console.log('Got user location:', location);
                        resolve(location);
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        reject(error);
                    },
                    { 
                        enableHighAccuracy: true, 
                        timeout: 15000,
                        maximumAge: 0 
                    }
                );
            });
        }
        
        // Update user marker on map
        function updateUserMarker(lat, lng) {
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { icon: userIcon })
                    .addTo(map)
                    .bindPopup('<b>📍 Your Location</b>');
            }
        }
        
        // Update range circle on map (RED circle showing max range)
        function updateRangeCircle(lat, lng, radiusKm) {
            const radiusMeters = radiusKm * 1000;
            
            if (rangeCircle) {
                rangeCircle.setLatLng([lat, lng]);
                rangeCircle.setRadius(radiusMeters);
            } else {
                rangeCircle = L.circle([lat, lng], {
                    color: '#ef4444',
                    fillColor: '#ef4444',
                    fillOpacity: 0.1,
                    weight: 2,
                    dashArray: '5, 10',
                    radius: radiusMeters
                }).addTo(map);
            }
        }
        
        // Clear station markers
        function clearStationMarkers() {
            stationMarkers.forEach(item => map.removeLayer(item.marker));
            stationMarkers = [];
            stationsData = [];
        }
        
        // Create popup content for station
        function createPopupContent(station) {
            const availableSlots = station.available_slots;
            const slotStatus = availableSlots > 0 
                ? `${availableSlots} / ${station.total_slots}` 
                : `Full (${station.total_slots} total)`;
            
            const distanceInfo = station.distance !== null 
                ? `<p><strong>Distance (Straight-line):</strong> ${station.distance.toFixed(2)} km</p>` 
                : '';
            
            const reachableStatus = station.is_reachable 
                ? '<span class="status-reachable">✓ Within range</span>'
                : '<span class="status-unreachable">✗ Out of range</span>';
            
            const routeButton = userLocation 
                ? `<button class="btn-route" onclick="showRouteToStation(${station.id}, ${station.latitude}, ${station.longitude}, '${station.name.replace(/'/g, "\\'")}')">
                        🗺️ Show Route
                   </button>`
                : '';
            
            const bookButton = availableSlots > 0 
                ? `<button class="btn-book" onclick="openBookingModal(${station.id}, '${station.name.replace(/'/g, "\\'")}')">
                        🎫 Book Slot
                   </button>`
                : `<button class="btn-book btn-disabled" disabled>
                        Station Full
                   </button>`;
            
            return `
                <div class="station-popup">
                    <h3>⚡ ${station.name}</h3>
                    <div class="popup-info">
                        <p><strong>Connector:</strong> ${station.connector_type}</p>
                        <p><strong>Price:</strong> ₹${station.price_per_unit}/kWh</p>
                        ${distanceInfo}
                        <p><strong>Status:</strong> ${reachableStatus}</p>
                        <p><strong>Slots:</strong> ${slotStatus}</p>
                    </div>
                    <div class="popup-actions">
                        ${routeButton}
                        ${bookButton}
                    </div>
                </div>
            `;
        }
        
        // Add station markers to map
        function addStationMarkers(stations) {
            clearStationMarkers();
            stationsData = stations;
            
            stations.forEach(station => {
                let icon;
                if (station.available_slots === 0) {
                    icon = stationIconFull;
                } else if (station.is_reachable) {
                    icon = stationIconReachable;
                } else {
                    icon = stationIconUnreachable;
                }
                
                const marker = L.marker([station.latitude, station.longitude], { icon })
                    .addTo(map)
                    .bindPopup(createPopupContent(station), { maxWidth: 320 });
                
                stationMarkers.push({ marker, station });
            });
        }
        
        // Clear existing route
        function clearRoute() {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            if (currentRoute) {
                map.removeLayer(currentRoute);
                currentRoute = null;
            }
            document.getElementById('directions-container').classList.add('hidden');
        }
        
        // Show route to station with turn-by-turn directions
        function showRouteToStation(stationId, lat, lng, name) {
            if (!userLocation) {
                alert('⚠️ User location not available. Please click "Find Stations" first.');
                return;
            }
            
            showLoading(true);
            clearRoute();
            
            // Create routing control with OSRM
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLocation.lat, userLocation.lng),
                    L.latLng(lat, lng)
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                showAlternatives: false,
                lineOptions: {
                    styles: [{
                        color: '#3b82f6',
                        opacity: 0.8,
                        weight: 6
                    }],
                    extendToWaypoints: true,
                    missingRouteTolerance: 0
                },
                createMarker: function() { return null; },
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                })
            }).addTo(map);
            
            // Listen for routing results
            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                const route = routes[0];
                
                // Get route details
                const distance = (route.summary.totalDistance / 1000).toFixed(2);
                const duration = Math.round(route.summary.totalTime / 60);
                const instructions = route.instructions;
                
                // Display route summary
                const summaryHtml = `
                    <div class="route-info">
                        <div class="route-destination">
                            <strong>📍 To: ${name}</strong>
                        </div>
                        <div class="route-stats">
                            <div class="stat">
                                <span class="stat-icon">🛣️</span>
                                <span class="stat-value">${distance} km</span>
                                <span class="stat-label">Distance</span>
                            </div>
                            <div class="stat">
                                <span class="stat-icon">⏱️</span>
                                <span class="stat-value">${duration} min</span>
                                <span class="stat-label">ETA</span>
                            </div>
                        </div>
                    </div>
                `;
                
                // Display turn-by-turn directions
                const directionsHtml = instructions.map((instruction, index) => {
                    const icon = getDirectionIcon(instruction.type);
                    const distanceText = instruction.distance > 1000 
                        ? `${(instruction.distance / 1000).toFixed(1)} km`
                        : `${Math.round(instruction.distance)} m`;
                    
                    return `
                        <div class="direction-step">
                            <div class="step-number">${index + 1}</div>
                            <div class="step-icon">${icon}</div>
                            <div class="step-content">
                                <div class="step-instruction">${instruction.text}</div>
                                <div class="step-distance">${distanceText}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('route-summary').innerHTML = summaryHtml;
                document.getElementById('directions-list').innerHTML = directionsHtml;
                document.getElementById('directions-container').classList.remove('hidden');
                
                showLoading(false);
                showStatus(`✅ Route calculated: ${distance} km, ~${duration} min`, 'success');
            });
            
            routingControl.on('routingerror', function(e) {
                showLoading(false);
                showStatus('❌ Unable to calculate route', 'error');
                console.error('Routing error:', e);
            });
        }
        
        // Get direction icon based on instruction type
        function getDirectionIcon(type) {
            const icons = {
                'Head': '🧭',
                'Continue': '⬆️',
                'Turn right': '➡️',
                'Turn left': '⬅️',
                'Slight right': '↗️',
                'Slight left': '↖️',
                'Sharp right': '↪️',
                'Sharp left': '↩️',
                'Roundabout': '🔄',
                'Destination': '🏁',
                'WaypointReached': '📍'
            };
            
            for (const [key, icon] of Object.entries(icons)) {
                if (type && type.includes(key.toLowerCase().replace(' ', ''))) {
                    return icon;
                }
            }
            return '➡️';
        }
        
        // Update station list in sidebar
        function updateStationList(stations) {
            const listContainer = document.getElementById('station-list');
            
            if (stations.length === 0) {
                listContainer.innerHTML = '<p class="placeholder-text">No stations found matching your criteria.</p>';
                return;
            }
            
            listContainer.innerHTML = stations.map(station => {
                const statusClass = station.is_reachable ? 'reachable' : 'unreachable';
                const slotsClass = station.available_slots > 0 ? 'available' : 'full';
                
                return `
                    <div class="station-card ${statusClass}" onclick="focusStation(${station.latitude}, ${station.longitude})">
                        <div class="station-header">
                            <h4>${station.name}</h4>
                            <span class="connector-badge">${station.connector_type}</span>
                        </div>
                        <div class="station-details">
                            <span class="detail-item">
                                <span class="detail-icon">📏</span>
                                ${station.distance !== null ? station.distance.toFixed(2) + ' km' : 'N/A'}
                            </span>
                            <span class="detail-item">
                                <span class="detail-icon">💰</span>
                                ₹${station.price_per_unit}/kWh
                            </span>
                            <span class="detail-item ${slotsClass}">
                                <span class="detail-icon">🅿️</span>
                                ${station.available_slots}/${station.total_slots} slots
                            </span>
                        </div>
                        <button class="btn-route-small" onclick="showRouteToStation(${station.id}, ${station.latitude}, ${station.longitude}, '${station.name.replace(/'/g, "\\'")}')">
                            🗺️ Get Directions
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        // Focus on a station on the map
        function focusStation(lat, lng) {
            map.setView([lat, lng], 15);
            
            stationMarkers.forEach(item => {
                const markerLatLng = item.marker.getLatLng();
                if (Math.abs(markerLatLng.lat - lat) < 0.0001 && Math.abs(markerLatLng.lng - lng) < 0.0001) {
                    item.marker.openPopup();
                }
            });
        }
        
        // Open booking modal
        function openBookingModal(stationId, stationName) {
            const userName = prompt(`🎫 Book a slot at:\n${stationName}\n\nPlease enter your name:`);
            
            if (userName && userName.trim()) {
                bookSlot(stationId, userName.trim());
            } else if (userName !== null) {
                alert('❌ Please enter a valid name to book a slot.');
            }
        }
        
        // Book a slot via API
        async function bookSlot(stationId, userName) {
            try {
                showLoading(true);
                
                const response = await fetch('/api/book_slot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        station_id: stationId,
                        user_name: userName
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ Booking Successful!\n\nHello ${userName}, your charging slot has been booked!\n\nRemaining slots: ${data.available_slots}`);
                    findStations();
                } else {
                    if (data.message === 'Full') {
                        alert('❌ Booking Failed\n\nSorry, all slots are now full. Please try another station.');
                    } else {
                        alert(`❌ Booking Failed\n\n${data.message}`);
                    }
                }
            } catch (error) {
                console.error('Booking error:', error);
                alert('❌ Error booking slot. Please check your connection and try again.');
            } finally {
                showLoading(false);
            }
        }
        
        // Fetch stations from API
        async function fetchStations(lat, lng, batteryPercent, connectorType) {
            const params = new URLSearchParams({
                lat: lat,
                long: lng,
                battery_percent: batteryPercent,
                connector_type: connectorType
            });
            
            const response = await fetch(`/api/stations?${params}`);
            return await response.json();
        }
        
        // Main function to find stations
        async function findStations() {
            try {
                showLoading(true);
                showStatus('📍 Getting your location...', 'info');
                
                try {
                    userLocation = await getUserLocation();
                    showStatus('✓ Location found!', 'success');
                } catch (error) {
                    console.warn('Geolocation failed, using default location:', error);
                    userLocation = { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1] };
                    showStatus('⚠️ Using default location (Pune center)', 'warning');
                }
                
                const batteryPercent = parseInt(document.getElementById('battery-percent').value);
                const connectorType = document.getElementById('connector-type').value;
                const rangeKm = (MAX_RANGE_KM * batteryPercent) / 100;
                
                updateUserMarker(userLocation.lat, userLocation.lng);
                updateRangeCircle(userLocation.lat, userLocation.lng, rangeKm);
                map.setView([userLocation.lat, userLocation.lng], 12);
                
                showStatus('🔍 Fetching stations...', 'info');
                
                const data = await fetchStations(
                    userLocation.lat, 
                    userLocation.lng, 
                    batteryPercent, 
                    connectorType
                );
                
                if (data.success) {
                    addStationMarkers(data.stations);
                    updateStationList(data.stations);
                    
                    const reachableCount = data.stations.filter(s => s.is_reachable).length;
                    showStatus(
                        `✅ Found ${data.stations.length} stations (${reachableCount} within range)`, 
                        'success'
                    );
                    
                    if (data.stations.length > 0) {
                        const allPoints = [
                            [userLocation.lat, userLocation.lng],
                            ...data.stations.map(s => [s.latitude, s.longitude])
                        ];
                        const bounds = L.latLngBounds(allPoints);
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                } else {
                    showStatus('❌ Error: ' + data.error, 'error');
                }
                
            } catch (error) {
                console.error('Error finding stations:', error);
                showStatus('❌ Error: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Show/hide loading overlay
        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }
        
        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    statusEl.className = 'status-message';
                }, 5000);
            }
        }
        
        // Update range display based on battery slider
        function updateRangeDisplay() {
            const batteryPercent = parseInt(document.getElementById('battery-percent').value);
            const rangeKm = (MAX_RANGE_KM * batteryPercent) / 100;
            
            document.getElementById('battery-value').textContent = batteryPercent;
            document.getElementById('range-value').textContent = `${rangeKm.toFixed(0)} km`;
            
            if (rangeCircle && userLocation) {
                updateRangeCircle(userLocation.lat, userLocation.lng, rangeKm);
            }
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            
            document.getElementById('battery-percent').addEventListener('input', updateRangeDisplay);
            document.getElementById('find-stations-btn').addEventListener('click', findStations);
            document.getElementById('close-directions').addEventListener('click', () => {
                clearRoute();
            });
            
            updateRangeDisplay();
        });
    </script>
</body>
</html>
