<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Finder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            EV Charging Station Finder
        </h1>
        <span class="header-subtitle">Find charging stations near you</span>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Map Container -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Nearby Stations
                    <span id="stationCount" class="station-count">0</span>
                </h2>
            </div>
            <div id="stationList" class="station-list">
                <!-- Loading state -->
                <div class="loading-container" id="loadingState">
                    <div class="loading-spinner"></div>
                    <p>Loading stations...</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Add Station Button -->
    <button class="add-station-btn" onclick="openModal()" title="Add New Station">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <!-- Add Station Modal -->
    <div id="addStationModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Add New Charging Station</h2>
                <button class="close-modal" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="formAlert"></div>
                <form id="addStationForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="stationName">Station Name *</label>
                        <input type="text" id="stationName" name="name" required placeholder="e.g., Tata Power EV Station">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude *</label>
                            <input type="number" id="latitude" name="latitude" step="any" required placeholder="18.5204">
                        </div>
                        <div class="form-group">
                            <label for="longitude">Longitude *</label>
                            <input type="number" id="longitude" name="longitude" step="any" required placeholder="73.8567">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="chargerType">Charger Type *</label>
                        <input type="text" id="chargerType" name="charger_type" required placeholder="e.g., DC Fast (50kW)">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Price *</label>
                            <input type="text" id="price" name="price" required placeholder="e.g., ₹15/kWh">
                        </div>
                        <div class="form-group">
                            <label for="status">Status *</label>
                            <select id="status" name="status" required>
                                <option value="Available">Available</option>
                                <option value="Busy">Busy</option>
                                <option value="Maintenance">Maintenance</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Station</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // Configuration
        const CONFIG = {
            center: [18.5204, 73.8567], // Pune, India
            zoom: 12,
            apiEndpoint: '/api/stations'
        };

        // Global variables
        let map;
        let markers = [];
        let stationsData = [];

        // Initialize the map
        function initMap() {
            map = L.map('map').setView(CONFIG.center, CONFIG.zoom);
            
            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Load stations
            fetchStations();
        }

        // Custom marker icon
        function createMarkerIcon(status) {
            const colors = {
                'Available': '#10b981',
                'Busy': '#f59e0b',
                'Maintenance': '#ef4444'
            };
            
            const color = colors[status] || colors['Available'];
            
            return L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div style="
                        background-color: ${color};
                        width: 30px;
                        height: 30px;
                        border-radius: 50%;
                        border: 3px solid white;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </div>
                `,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        // Fetch stations from API
        async function fetchStations() {
            const loadingState = document.getElementById('loadingState');
            const stationList = document.getElementById('stationList');
            
            try {
                const response = await fetch(CONFIG.apiEndpoint);
                const result = await response.json();
                
                if (result.success) {
                    stationsData = result.data;
                    updateStationCount(stationsData.length);
                    renderStations(stationsData);
                    addMarkersToMap(stationsData);
                } else {
                    showError(result.error || 'Failed to load stations');
                }
            } catch (error) {
                console.error('Error fetching stations:', error);
                showError('Unable to connect to server. Please try again later.');
            }
        }

        // Update station count badge
        function updateStationCount(count) {
            document.getElementById('stationCount').textContent = count;
        }

        // Get status badge HTML
        function getStatusBadge(status) {
            const statusClasses = {
                'Available': 'status-available',
                'Busy': 'status-busy',
                'Maintenance': 'status-maintenance'
            };
            
            const statusClass = statusClasses[status] || 'status-available';
            return `<span class="status-badge ${statusClass}">${status}</span>`;
        }

        // Render stations in sidebar
        function renderStations(stations) {
            const stationList = document.getElementById('stationList');
            
            if (stations.length === 0) {
                stationList.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <h3>No stations found</h3>
                        <p>There are no charging stations in this area.</p>
                    </div>
                `;
                return;
            }

            stationList.innerHTML = stations.map(station => `
                <div class="station-card" data-id="${station.id}" onclick="focusStation(${station.id})">
                    <div class="station-name">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                        ${station.name}
                    </div>
                    <div class="station-details">
                        <div class="station-detail">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
                                <line x1="22" y1="11" x2="22" y2="13"></line>
                            </svg>
                            ${station.charger_type}
                        </div>
                        <div class="station-detail">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="1" x2="12" y2="23"></line>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                            ${station.price}
                        </div>
                        <div class="station-detail">
                            ${getStatusBadge(station.status)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add markers to map
        function addMarkersToMap(stations) {
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            stations.forEach(station => {
                const marker = L.marker(
                    [station.latitude, station.longitude],
                    { icon: createMarkerIcon(station.status) }
                );

                // Create popup content
                const popupContent = `
                    <div class="popup-content">
                        <div class="popup-title">${station.name}</div>
                        <div class="popup-info">
                            <div class="popup-row">
                                <span class="popup-label">Type:</span>
                                <span class="popup-value">${station.charger_type}</span>
                            </div>
                            <div class="popup-row">
                                <span class="popup-label">Price:</span>
                                <span class="popup-value">${station.price}</span>
                            </div>
                            <div class="popup-row">
                                <span class="popup-label">Status:</span>
                                <span class="popup-value">${getStatusBadge(station.status)}</span>
                            </div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                
                // Highlight sidebar card on marker click
                marker.on('click', () => highlightStationCard(station.id));
                
                marker.addTo(map);
                markers.push({ id: station.id, marker });
            });

            // Fit map to show all markers if there are any
            if (stations.length > 0) {
                const group = new L.featureGroup(markers.map(m => m.marker));
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Focus on a specific station
        function focusStation(stationId) {
            const station = stationsData.find(s => s.id === stationId);
            if (!station) return;

            // Pan to station location
            map.setView([station.latitude, station.longitude], 15);

            // Open the marker popup
            const markerObj = markers.find(m => m.id === stationId);
            if (markerObj) {
                markerObj.marker.openPopup();
            }

            // Highlight the card
            highlightStationCard(stationId);
        }

        // Highlight station card in sidebar
        function highlightStationCard(stationId) {
            // Remove active class from all cards
            document.querySelectorAll('.station-card').forEach(card => {
                card.classList.remove('active');
            });

            // Add active class to selected card
            const selectedCard = document.querySelector(`.station-card[data-id="${stationId}"]`);
            if (selectedCard) {
                selectedCard.classList.add('active');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Show error message
        function showError(message) {
            const stationList = document.getElementById('stationList');
            stationList.innerHTML = `
                <div class="error-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h3>Unable to Load Stations</h3>
                    <p>${message}</p>
                    <button class="retry-btn" onclick="fetchStations()">Try Again</button>
                </div>
            `;
        }

        // Modal functions
        function openModal() {
            document.getElementById('addStationModal').classList.add('active');
            document.getElementById('addStationForm').reset();
            document.getElementById('formAlert').innerHTML = '';
        }

        function closeModal() {
            document.getElementById('addStationModal').classList.remove('active');
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'addStationModal') {
                closeModal();
            }
        }

        // Handle form submission
        async function handleSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const formAlert = document.getElementById('formAlert');
            const form = event.target;
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            formAlert.innerHTML = '';
            
            // Get form data
            const formData = new FormData(form);
            const stationData = {
                name: formData.get('name'),
                latitude: parseFloat(formData.get('latitude')),
                longitude: parseFloat(formData.get('longitude')),
                charger_type: formData.get('charger_type'),
                price: formData.get('price'),
                status: formData.get('status')
            };
            
            try {
                const response = await fetch('/api/stations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(stationData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success message
                    formAlert.innerHTML = `
                        <div class="alert alert-success">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Station added successfully!
                        </div>
                    `;
                    
                    // Reset form
                    form.reset();
                    
                    // Reload stations
                    await fetchStations();
                    
                    // Close modal after short delay
                    setTimeout(() => {
                        closeModal();
                    }, 1500);
                } else {
                    throw new Error(result.error || 'Failed to add station');
                }
            } catch (error) {
                console.error('Error adding station:', error);
                formAlert.innerHTML = `
                    <div class="alert alert-error">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        ${error.message}
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Station';
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initMap);
        
        // Close modal on Escape key
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
